services:

  schindler-ai:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    image: schindler-ai-platform:latest

    container_name: schindler-ai

    ports:
      - "8501:8501"

    # ── Persistent storage ──────────────────────────────────────────────────
    # The SQLite database and any runtime files survive container restarts
    volumes:
      - schindler-data:/app/data

    environment:
      # Streamlit
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false

      # Optional: set your Groq key here so ARIA works out of the box
      # - GROQ_API_KEY=gsk_your_key_here

    # ── Resource limits ─────────────────────────────────────────────────────
    # TensorFlow + Random Forest can be memory-hungry — adjust to your machine
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ── Named volume ────────────────────────────────────────────────────────────
volumes:
  schindler-data:
    driver: local
